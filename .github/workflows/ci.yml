name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/Dse.Tests --filter "Category!=LargeEvaluation" --no-build -c Release --collect:"XPlat Code Coverage"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/contracts/requirements.txt
      - run: python -m coverage run --source=tests/contracts -m unittest discover -s tests/contracts
      - run: python -m unittest discover -s tests/evaluation
      - run: dotnet run --project src/Dse.Evaluation --no-build -c Release -- --out .artifacts/evaluation-smoke
      - run: python -m coverage report --include="*/contract_rules.py" --fail-under=80
      - run: npm ci && npm run test:auth && npm run build
        working-directory: web
      - run: az bicep install --version v0.47.16
      - run: python3 scripts/deploy.py validate
      - run: python3 -m coverage run --source=scripts -m unittest discover -s tests/scripts
      - run: python3 -m coverage report --include="*/delivery*.py" --fail-under=80
      - name: Validate Actions workflows
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: git diff --check
  browser-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each suite gets a fresh API and rate-limit budget, as well as fresh data.
      matrix:
        suite: [knowledge, conversations, chat-assistance, documents, profiles, search, logout, workspace, business-analysis, identity-disclosure, workspace-anonymity]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e -- tests/${{ matrix.suite }}.spec.ts --workers=1 --trace retain-on-failure
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.suite }}
          path: web/test-results
          retention-days: 7
